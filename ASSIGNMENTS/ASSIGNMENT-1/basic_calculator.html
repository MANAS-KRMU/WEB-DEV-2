<!DOCTYPE html>
<html>

<head>
    <title>Basic calculator</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        .button-cont {
            display: flex;
            justify-content: space-between;
            align-items: center;
            width: 342px;
        }
    </style>
</head>

<body>
    <input type="number" id="num1" name="number_1" placeholder="Enter 1st number">
    <input type="number" id="num2" name="number_2" placeholder="Enter 2nd number">
    <br><br>
    <div class="button-cont">
        <button onclick="add()" id="Add">Add</button>
        <button onclick="subtract()" id="subtract">Subtract</button>
        <button onclick="multiply()" id="multiply">Multiply</button>
        <button onclick="divide()" id="divide">Divide</button>
    </div>

    <h2 id="result">Result -: </h2>

    <script>

        function add() {
            const num1 = parseFloat(document.getElementById("num1").value)
            const num2 = parseFloat(document.getElementById("num2").value) 
            document.getElementById("result").innerText = "Result -: " + (num1 + num2)
        }

        function subtract() {
            const num1 = parseFloat(document.getElementById("num1").value)
            const num2 = parseFloat(document.getElementById("num2").value)
            document.getElementById("result").innerText = "Result -: " + (num1 - num2)
        }

        function multiply() {
            const num1 = parseFloat(document.getElementById("num1").value)
            const num2 = parseFloat(document.getElementById("num2").value)
            document.getElementById("result").innerText = "Result -: " + (num1 * num2)
        }

        function divide() {
            const num1 = parseFloat(document.getElementById("num1").value)
            const num2 = parseFloat(document.getElementById("num2").value)
            if (num2 == 0) {
                document.getElementById("result").innerText = "Result -: Undefined (2nd number cannot be equal to zero)"  
            } else {
                document.getElementById("result").innerText = "Result -: " + (num1 / num2)
            }
        }
    </script>
    
</body>

</html>
