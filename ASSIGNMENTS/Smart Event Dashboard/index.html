<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Event Dashboard</title>
    <link rel="stylesheet" href="index.css">
    <style>
        * {
            margin: 0;
            padding: 0; 
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            min-height: 100vh;
            background: linear-gradient(135deg, #1ce2d5bd, #057293);
            padding: 20px;
        }
    </style>
</head>
<body>
    <div style="margin: 0 auto; display: flex; justify-content: center; align-items: center;" >
        <h1 style="color: white;text-shadow: 3px 2px 5px #057293;">🎯Smart Event Dashboard</h1>
    </div>
    <!-- Container -->
    <div class="container">
        <!-- Add Event Form -->
        <div class="add_event">
            <h1>Add New Event</h1>
            <form>
                <label for="eve_title">Event Title:</label><br>
                <input id="eve_title" type="text" placeholder="Title of your Event" required>
                <br><br>
                <label for="eve_date">Event Date:</label><br>
                <input id="eve_date" type="date" placeholder="dd-mm-yyyy" required>
                <br><br>
                <label for="eve_category">Category:</label><br>
                <select id="eve_category" required>
                    <option value="">Select Option</option>
                    <option value="Conference">Conference</option>
                    <option value="Workshop">Workshop</option>
                    <option value="Meetup">Meetup</option>
                    <option value="Webinar">Webinar</option>
                    <option value="Social">Social</option>
                </select>
                <br><br>
                <label for="eve_description">Description</label><br>
                <textarea id="eve_description" placeholder="Enter a brief note for your Event"></textarea>
                <br><br>
                <input id="eve_addbtn" type="submit">
            </form>
        </div>
        <!-- My Events -->
        <div class="my_events">
            <h1>My Events</h1>
            <div class="my_eventbtns">
                <button class="clear_all">Clear All Events</button>
                <button class="add_sample">Add Sample Events</button>
            </div>
            <br><br>
            <div class="event_container">
                
            </div>
            
        </div>
        <!-- Dom Manipulation -->
        <div class="dom_manipulation">
            <h2>DOM Manipulation Demo</h2>
            <button id="keyOutput">You Pressed: None</button>
        </div>
    </div>
</body>
<script src="index.js"></script>
</html>
